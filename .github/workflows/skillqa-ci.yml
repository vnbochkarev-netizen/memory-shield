name: SkillQA

on:
  pull_request:
    paths: ["SKILL.md", "README.md", "scripts/**", "bin/**", ".github/**"]
  push:
    paths: ["SKILL.md", "README.md", "scripts/**", "bin/**", ".github/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  skillqa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install SkillQA (from release)
        run: |
          curl -fsSL -o /tmp/skillqa.zip https://github.com/vnbochkarev-netizen/ViBo-SkillQA/releases/download/v0.2.8/vibo-skillqa-0.2.8.zip
          mkdir -p /tmp/skillqa && cd /tmp/skillqa && unzip -q -o /tmp/skillqa.zip

      - name: Install local test license (full grading, 7 modules)
        run: cd /tmp/skillqa && python3 -c "import skillqa; skillqa.install_test_license()"

      - name: Run SkillQA on the skill
        id: qa
        run: |
          cd /tmp/skillqa && python3 skillqa.py test "$GITHUB_WORKSPACE" --lang en --skip parallel,sandbox 2>&1 | tee /tmp/qa_out.txt
          echo "--- report details ---"
          REPORT=$(ls -t qa_reports/*/*.md 2>/dev/null | head -1)
          if [ -n "$REPORT" ]; then grep -E "✗|Grade|Static|secret|path" "$REPORT" | head -10; fi
        continue-on-error: true

      - name: Post grade to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('/tmp/qa_out.txt', 'utf8');
            const grade = (out.match(/Grade: ([A-D])/) || [])[1] || '?';
            const fail = (out.match(/fail_count=(\d+)/) || [])[1] ?? '?';
            const body = `## 🤖 ViBo SkillQA: Grade **${grade}** (fail_count=${fail})\n\n\`\`\`\n${out.slice(-2500)}\n\`\`\`\n\n_⚠️ sandbox/parallel skipped on CI runner (no unshare) — structural checks only._\n\n*Certified by ViBo SkillQA — check your skills, certify them, sell with confidence.*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
